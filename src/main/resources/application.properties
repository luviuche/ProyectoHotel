spring.application.name=ProyectoHotel

spring.datasource.url=${URL_BD:jdbc:postgresql://localhost:5432/proyecto_hotel}
spring.datasource.username=${USUARIO_BD:postgres}
spring.datasource.password=${CLAVE_BD:postgres}

# Flyway es el dueno del esquema; Hibernate solo valida que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

